name: Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: activity-graph
  cancel-in-progress: false
jobs:
  activity-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: alexcerezo/activity-graph@v1
